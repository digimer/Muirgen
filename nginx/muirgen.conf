# Save this in /etc/nginx/conf.d/
server {
  listen 80;
  server_name _; # Responds to any IP or hostname
  
  # Increase the maximum file upload size to 50 MiB. To change this, also update:
  # - 'frontend/src/utils/media.js -> MAX_SIZE'
  client_max_body_size 50m;

  # Add support for displaying images and files.
  location /uploads/ {
    alias /home/admin/fui/uploads/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public, no-transform";
  }
  
  # NOTE: We use 127.0.0.1 instead opf localhost to force IPv4, which matches the node.js process's 
  #       listener.
  # We now build manually, so the node.js on port 5000 is now the source of truth.
  location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
  }

  # Proxy all '/api' requests
  location /api/ {
    proxy_pass http://127.0.0.1:5000/api/; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
